[pytest]
# ../backend_bot: os testes de integração sobem o backend real.
pythonpath = . ../backend_bot
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Um teste travado (ex.: servidor que não desliga) falha em vez de segurar a suíte inteira.
timeout = 60
markers =
    livekit: precisa do LiveKit local rodando (docker compose -f infra_sfu/dev/docker-compose.yml up -d)
    tela: captura a tela de verdade (precisa de uma sessão de desktop do Windows)
